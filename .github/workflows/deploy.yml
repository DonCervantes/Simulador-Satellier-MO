name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_CESIUM_TOKEN: ${{ secrets.VITE_CESIUM_TOKEN }}

      - name: Fix Cesium asset paths for GitHub Pages
        working-directory: frontend
        run: |
          # vite-plugin-cesium with base='/Simulador-Satellier-MO/' writes Cesium
          # static files to dist/Simulador-Satellier-MO/cesium/ (double base path).
          # The HTML <script src="/Simulador-Satellier-MO/cesium/Cesium.js"> resolves
          # to dist/cesium/ on GitHub Pages, so we copy the files there.
          if [ -d "dist/Simulador-Satellier-MO/cesium" ]; then
            cp -r dist/Simulador-Satellier-MO/cesium dist/cesium
            echo "Copied Cesium assets to dist/cesium/"
          else
            echo "dist/Simulador-Satellier-MO/cesium not found — skipping copy"
            ls dist/ || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
